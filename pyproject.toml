[project]
name = "docmind-agents"
version = "0.1.0"
requires-python = ">=3.11,<4.0"

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
fastapi = "^0.142.2"
google-genai = "^2.29.0"
langgraph = "^1.2.12"
pydantic = "^2.13.5"
pydantic-settings = "^2.15.0"
uvicorn = "^0.54.0"

[tool.poetry.group.dev.dependencies]
ruff = "0.16.10"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
